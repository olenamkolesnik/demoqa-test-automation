<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Playwright report history</title>
    <style>
      :root {
        color-scheme: light dark;
      }
      body {
        font: 15px/1.5 system-ui, sans-serif;
        margin: 2rem auto;
        max-width: 60rem;
        padding: 0 1rem;
      }
      h1 {
        font-size: 1.3rem;
      }
      table {
        border-collapse: collapse;
        width: 100%;
      }
      th,
      td {
        text-align: left;
        padding: 0.5rem 0.6rem;
        border-bottom: 1px solid #8883;
      }
      th {
        font-size: 0.8rem;
        text-transform: uppercase;
        letter-spacing: 0.04em;
        opacity: 0.7;
      }
      .ok {
        color: #17803d;
      }
      .bad {
        color: #c02626;
      }
      @media (prefers-color-scheme: dark) {
        .ok {
          color: #4ade80;
        }
        .bad {
          color: #f87171;
        }
      }
    </style>
  </head>
  <body>
    <h1>Playwright report history</h1>
    <p><a href="index.html">Latest report</a> — newest 1 runs on main.</p>
    <table>
      <thead>
        <tr>
          <th>Run</th>
          <th>Status</th>
          <th>Branch</th>
          <th>Commit</th>
          <th>Date</th>
          <th>Link</th>
        </tr>
      </thead>
      <tbody>
      <tr>
        <td><a href="runs/26/index.html">#26</a></td>
        <td class="ok">passed</td>
        <td>main</td>
        <td><code>0af750b</code></td>
        <td>2026-09-02 14:04 UTC</td>
        <td><a href="https://github.com/olenamkolesnik/demoqa-test-automation/actions/runs/33639512483">workflow</a></td>
      </tr>
      </tbody>
    </table>
  </body>
</html>
